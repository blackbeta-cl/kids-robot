name: Preparar arduino-cli
description: Instala arduino-cli, el core esp32 y las librerías del firmware (con caché).
runs:
  using: composite
  steps:
    - uses: arduino/setup-arduino-cli@v2
    - name: Caché del core y las librerías
      uses: actions/cache@v4
      with:
        path: |
          ~/.arduino15
          ~/Arduino/libraries
        key: arduino-esp32-3.3.12-${{ hashFiles('.github/actions/arduino/action.yml') }}
    - name: Instalar core y librerías
      shell: bash
      run: |
        arduino-cli config init --overwrite
        arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
        arduino-cli core update-index
        arduino-cli core install esp32:esp32@3.3.12
        arduino-cli lib install "Adafruit SSD1306@2.5.17" "Adafruit GFX Library@1.13.0" "Adafruit BusIO@1.17.4" "ArduinoJson@7.4.3"
